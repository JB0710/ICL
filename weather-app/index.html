<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Radar & Forecast</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Tailwind CSS (for easy modern styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom scrollbar and general tweaks for dashboard */
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #radar-map {
      height: 60vh;
      width: 100%;
      background-color: #111827;
      position: relative;
    }
    #forecast-panel {
      height: 40vh;
      width: 100%;
      background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
      border-top: 2px solid #374151;
      box-shadow: 0 -8px 24px -4px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      box-sizing: border-box;
    }
    /* Radar control styling overlay */
    .radar-control {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid #4b5563;
      padding: 10px 16px;
      border-radius: 10px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .radar-control button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
    }
    .radar-control button:hover {
      background: #1d4ed8;
    }
    /* Map customization: Dark theme map */
    .leaflet-container {
      background: #111827;
    }
    /* Hide leaflet controls we don t want or style them dark */
    .leaflet-bar {
      border: 1px solid #374151 !important;
    }
    .leaflet-bar a {
      background-color: #111827 !important;
      color: #9ca3af !important;
      border-bottom: 1px solid #1f2937 !important;
    }
    .leaflet-bar a:hover {
      background-color: #1f2937 !important;
      color: #f3f4f6 !important;
    }
  </style>
</head>
<body>

  <!-- Top 60% Radar Map Area -->
  <div id="radar-map">
    <!-- Overlay info and playback control -->
    <div class="radar-control">
      <div class="flex items-center gap-2">
        <i data-lucide="radio" class="text-red-500 animate-pulse w-6 h-6"></i>
        <span class="font-bold tracking-wider">RADAR PLAYBACK</span>
      </div>
      <div id="radar-time" class="text-blue-400 font-mono font-black min-w-[100px] text-center text-lg">Loading...</div>
      <button id="btn-play-pause">Pause</button>
      <div class="text-gray-400 text-sm flex items-center gap-1">
        <i data-lucide="info" class="w-5 h-5"></i>
        <span>Looping last 2h</span>
      </div>
    </div>
  </div>

  <!-- Bottom 40% Forecast and Current Conditions Area (Optimized for Large TV/Signage) -->
  <div id="forecast-panel">
    <!-- Current & Quick Stats row -->
    <div class="flex justify-between items-center pb-3 border-b border-gray-800">
      <div class="flex items-center gap-6">
        <div>
          <h1 id="location-title" class="text-3xl font-black text-white tracking-tight">Loading Location...</h1>
          <p id="current-time-text" class="text-sm text-gray-400 font-semibold">Loading local time...</p>
        </div>
        <div class="flex items-center gap-3 bg-gray-900/80 px-4 py-2.5 rounded-xl border border-gray-800">
          <div id="current-icon-container">
            <i data-lucide="cloud-sun" class="w-12 h-12 text-yellow-400"></i>
          </div>
          <div>
            <div class="flex items-start">
              <span id="current-temp" class="text-4xl font-black leading-none">--</span>
              <span id="temp-unit-symbol" class="text-lg font-black ml-0.5 text-gray-400">°F</span>
            </div>
            <p id="current-condition-text" class="text-xs font-bold text-gray-300">Loading...</p>
          </div>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="flex gap-6">
        <div class="flex items-center gap-3 bg-gray-900/40 px-4 py-2 rounded-xl border border-gray-800/50">
          <i data-lucide="droplets" class="w-7 h-7 text-blue-400"></i>
          <div>
            <p class="text-[11px] text-gray-400 uppercase tracking-wider font-extrabold">Humidity</p>
            <p id="metric-humidity" class="text-lg font-extrabold text-gray-100">--%</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-gray-900/40 px-4 py-2 rounded-xl border border-gray-800/50">
          <i data-lucide="wind" class="text-teal-400 w-7 h-7"></i>
          <div>
            <p class="text-[11px] text-gray-400 uppercase tracking-wider font-extrabold">Wind</p>
            <p id="metric-wind" class="text-lg font-extrabold text-gray-100">-- mph</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-gray-900/40 px-4 py-2 rounded-xl border border-gray-800/50">
          <i data-lucide="cloud-rain" class="text-indigo-400 w-7 h-7"></i>
          <div>
            <p class="text-[11px] text-gray-400 uppercase tracking-wider font-extrabold">Rain Prob</p>
            <p id="metric-precip" class="text-lg font-extrabold text-gray-100">--%</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-gray-900/40 px-4 py-2 rounded-xl border border-gray-800/50">
          <i data-lucide="sun" class="text-amber-400 w-7 h-7"></i>
          <div>
            <p class="text-[11px] text-gray-400 uppercase tracking-wider font-extrabold">UV Index</p>
            <p id="metric-uv" class="text-lg font-extrabold text-gray-100">--</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 5-Day Forecast horizontal display (Cards enlarged for high-vis TV digital signage with exactly 5px top & bottom padding) -->
    <div id="forecast-cards" class="grid grid-cols-5 gap-4 pt-2 flex-grow items-center">
      <!-- Cards will be populated dynamically -->
      <div class="bg-gray-900/30 border border-gray-800/50 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-center animate-pulse h-[140px]">
        <div class="h-6 w-16 bg-gray-800 rounded mb-3"></div>
        <div class="h-12 w-12 bg-gray-800 rounded-full mb-3"></div>
        <div class="h-6 w-24 bg-gray-800 rounded"></div>
      </div>
      <div class="bg-gray-900/30 border border-gray-800/50 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-center animate-pulse h-[140px]">
        <div class="h-6 w-16 bg-gray-800 rounded mb-3"></div>
        <div class="h-12 w-12 bg-gray-800 rounded-full mb-3"></div>
        <div class="h-6 w-24 bg-gray-800 rounded"></div>
      </div>
      <div class="bg-gray-900/30 border border-gray-800/50 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-center animate-pulse h-[140px]">
        <div class="h-6 w-16 bg-gray-800 rounded mb-3"></div>
        <div class="h-12 w-12 bg-gray-800 rounded-full mb-3"></div>
        <div class="h-6 w-24 bg-gray-800 rounded"></div>
      </div>
      <div class="bg-gray-900/30 border border-gray-800/50 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-center animate-pulse h-[140px]">
        <div class="h-6 w-16 bg-gray-800 rounded mb-3"></div>
        <div class="h-12 w-12 bg-gray-800 rounded-full mb-3"></div>
        <div class="h-6 w-24 bg-gray-800 rounded"></div>
      </div>
      <div class="bg-gray-900/30 border border-gray-800/50 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-center animate-pulse h-[140px]">
        <div class="h-6 w-16 bg-gray-800 rounded mb-3"></div>
        <div class="h-12 w-12 bg-gray-800 rounded-full mb-3"></div>
        <div class="h-6 w-24 bg-gray-800 rounded"></div>
      </div>
    </div>
  </div>

  <script>
    // App Config & State variables
    let config = {
      latitude: 40.7128,
      longitude: -74.0060,
      locationName: "New York, NY",
      units: "imperial",
      radarZoom: 8,
      updateIntervalMinutes: 10
    };

    let map;
    let radarLayers = [];
    let radarFrames = [];
    let currentFrameIdx = 0;
    let radarIntervalId = null;
    let isPlaying = true;

    // Mapping WMO Weather Codes to icons and text descriptions
    const weatherCodeMap = {
      0: { text: "Clear Sky", icon: "sun", color: "text-amber-400" },
      1: { text: "Mainly Clear", icon: "cloud-sun", color: "text-amber-300" },
      2: { text: "Partly Cloudy", icon: "cloud-sun", color: "text-gray-300" },
      3: { text: "Overcast", icon: "cloud", color: "text-gray-400" },
      45: { text: "Foggy", icon: "cloud-fog", color: "text-blue-200" },
      48: { text: "Depositing Rime Fog", icon: "cloud-fog", color: "text-blue-300" },
      51: { text: "Light Drizzle", icon: "cloud-drizzle", color: "text-teal-300" },
      53: { text: "Moderate Drizzle", icon: "cloud-drizzle", color: "text-teal-400" },
      55: { text: "Dense Drizzle", icon: "cloud-drizzle", color: "text-teal-500" },
      56: { text: "Light Freezing Drizzle", icon: "cloud-snow", color: "text-sky-300" },
      57: { text: "Dense Freezing Drizzle", icon: "cloud-snow", color: "text-sky-400" },
      61: { text: "Slight Rain", icon: "cloud-rain", color: "text-blue-400" },
      63: { text: "Moderate Rain", icon: "cloud-rain", color: "text-blue-500" },
      65: { text: "Heavy Rain", icon: "cloud-rain", color: "text-blue-600" },
      66: { text: "Light Freezing Rain", icon: "cloud-snow", color: "text-indigo-400" },
      67: { text: "Heavy Freezing Rain", icon: "cloud-snow", color: "text-indigo-500" },
      71: { text: "Slight Snowfall", icon: "snowflake", color: "text-blue-100" },
      73: { text: "Moderate Snowfall", icon: "snowflake", color: "text-blue-200" },
      75: { text: "Heavy Snowfall", icon: "snowflake", color: "text-blue-300" },
      77: { text: "Snow Grains", icon: "snowflake", color: "text-gray-100" },
      80: { text: "Slight Rain Showers", icon: "cloud-lightning", color: "text-indigo-400" },
      81: { text: "Moderate Rain Showers", icon: "cloud-lightning", color: "text-indigo-500" },
      82: { text: "Violent Rain Showers", icon: "cloud-lightning", color: "text-indigo-600" },
      85: { text: "Slight Snow Showers", icon: "cloud-snow", color: "text-sky-100" },
      86: { text: "Heavy Snow Showers", icon: "cloud-snow", color: "text-sky-200" },
      95: { text: "Thunderstorm", icon: "cloud-lightning", color: "text-amber-500" },
      96: { text: "Thunderstorm with Slight Hail", icon: "cloud-lightning", color: "text-yellow-500" },
      99: { text: "Thunderstorm with Heavy Hail", icon: "cloud-lightning", color: "text-orange-600" }
    };

    function getWeatherInfo(code) {
      return weatherCodeMap[code] || { text: "Unknown", icon: "help-circle", color: "text-gray-400" };
    }

    async function initApp() {
      try {
        const response = await fetch("config.json");
        if (response.ok) {
          config = await response.json();
        }
      } catch (err) {
        console.warn("Could not load config.json, using defaults.", err);
      }

      lucide.createIcons();
      updateClock();
      setInterval(updateClock, 1000);
      initMap();
      fetchRadarAndWeather();

      const intervalMs = (config.updateIntervalMinutes || 10) * 60 * 1000;
      setInterval(fetchRadarAndWeather, intervalMs);

      document.getElementById("btn-play-pause").addEventListener("click", toggleRadarPlayback);
    }

    function updateClock() {
      const now = new Date();
      const options = { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true };
      document.getElementById("current-time-text").innerText = now.toLocaleString("en-US", options);
    }

    function initMap() {
      map = L.map("radar-map", {
        zoomControl: true,
        attributionControl: false
      }).setView([config.latitude, config.longitude], config.radarZoom);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19
      }).addTo(map);

      const pulseIcon = L.divIcon({
        className: "custom-div-icon",
        html: `<div class="w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-lg animate-ping absolute"></div><div class="w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-lg relative"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
      L.marker([config.latitude, config.longitude], { icon: pulseIcon }).addTo(map);
    }

    async function fetchRadarAndWeather() {
      fetchWeather();
      fetchRadarFrames();
    }

    async function fetchWeather() {
      try {
        const isImperial = config.units === "imperial";
        const tempUnit = isImperial ? "fahrenheit" : "celsius";
        const windUnit = isImperial ? "mph" : "kmh";
        const precipUnit = "inch";

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${config.latitude}&longitude=${config.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max&timezone=auto&temperature_unit=${tempUnit}&wind_speed_unit=${windUnit}&precipitation_unit=${precipUnit}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Weather API returned failure");
        const data = await response.json();

        document.getElementById("location-title").innerText = config.locationName;

        const current = data.current;
        const currentTemp = Math.round(current.temperature_2m);
        document.getElementById("current-temp").innerText = currentTemp;
        document.getElementById("temp-unit-symbol").innerText = isImperial ? "°F" : "°C";

        const weatherInfo = getWeatherInfo(current.weather_code);
        document.getElementById("current-condition-text").innerText = weatherInfo.text;

        const currentIconContainer = document.getElementById("current-icon-container");
        currentIconContainer.innerHTML = `<i data-lucide="${weatherInfo.icon}" class="w-12 h-12 ${weatherInfo.color}"></i>`;

        document.getElementById("metric-humidity").innerText = `${Math.round(current.relative_humidity_2m)}%`;
        document.getElementById("metric-wind").innerText = `${Math.round(current.wind_speed_10m)} ${isImperial ? "mph" : "km/h"}`;

        const todayPrecipProb = data.daily.precipitation_probability_max[0] || 0;
        document.getElementById("metric-precip").innerText = `${todayPrecipProb}%`;

        const todayUV = Math.round(data.daily.uv_index_max[0] || 0);
        document.getElementById("metric-uv").innerText = todayUV;

        const daily = data.daily;
        const forecastCardsContainer = document.getElementById("forecast-cards");
        forecastCardsContainer.innerHTML = "";

        for (let i = 0; i < 5; i++) {
          const dayCode = daily.weather_code[i];
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const dayInfo = getWeatherInfo(dayCode);

          const dateObj = new Date(daily.time[i] + "T00:00:00");
          const dayName = i === 0 ? "Today" : dateObj.toLocaleDateString("en-US", { weekday: "short" });

          const precipProb = daily.precipitation_probability_max[i] || 0;

          const card = document.createElement("div");
          // Exact 5px top & bottom padding with py-[5px] and px-4
          card.className = "bg-gray-900/50 border border-gray-800 rounded-2xl py-[5px] px-4 flex flex-col items-center justify-between text-center backdrop-blur-md shadow-lg transition-all hover:border-gray-700 h-[210px] w-full";
          card.innerHTML = `
            <span class="text-lg font-black text-blue-400 uppercase tracking-widest">${dayName}</span>
            <div class="my-2.5 flex flex-col items-center">
              <i data-lucide="${dayInfo.icon}" class="w-16 h-16 ${dayInfo.color} drop-shadow-md"></i>
              <span class="text-xs text-gray-300 mt-2 block truncate max-w-[140px] font-bold tracking-wide">${dayInfo.text}</span>
            </div>
            <div class="flex flex-col items-center w-full">
              <div class="flex gap-3 text-lg font-black">
                <span class="text-white">${maxTemp}°</span>
                <span class="text-gray-500">${minTemp}°</span>
              </div>
              <div class="flex items-center gap-1 mt-1 text-xs font-black text-indigo-400">
                <i data-lucide="droplet" class="w-3.5 h-3.5"></i>
                <span>${precipProb}%</span>
              </div>
            </div>
          `;
          forecastCardsContainer.appendChild(card);
        }

        lucide.createIcons();

      } catch (err) {
        console.error("Failed to update weather: ", err);
      }
    }

    async function fetchRadarFrames() {
      try {
        const response = await fetch("https://api.rainviewer.com/public/weather-maps.json");
        if (!response.ok) throw new Error("RainViewer API error");
        const data = await response.json();

        const pastFrames = data.radar.past || [];
        const forecastFrames = data.radar.nowcast || [];

        const allFrames = [...pastFrames, ...forecastFrames];
        if (allFrames.length === 0) return;

        clearRadarLayers();

        radarFrames = allFrames;
        radarLayers = new Array(allFrames.length).fill(null);

        currentFrameIdx = pastFrames.length > 0 ? pastFrames.length - 1 : 0;

        preloadRadarLayers();
        startRadarAnimation();

      } catch (err) {
        console.error("Failed to fetch RainViewer radar info: ", err);
      }
    }

    function clearRadarLayers() {
      if (radarIntervalId) {
        clearInterval(radarIntervalId);
        radarIntervalId = null;
      }
      radarLayers.forEach(layer => {
        if (layer && map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
      radarLayers = [];
      radarFrames = [];
    }

    function preloadRadarLayers() {
      radarFrames.forEach((frame, idx) => {
        const path = frame.path;
        const radarTileUrl = `https://tilecache.rainviewer.com${path}/256/{z}/{x}/{y}/2/1_1.png`;

        const layer = L.tileLayer(radarTileUrl, {
          opacity: 0,
          zIndex: 200,
          maxZoom: 19
        });

        radarLayers[idx] = layer;
        layer.addTo(map);
      });
    }

    function showFrame(index) {
      if (radarLayers.length === 0) return;

      radarLayers.forEach((layer, i) => {
        if (layer) {
          layer.setOpacity(i === index ? 0.65 : 0);
        }
      });

      const frameTime = new Date(radarFrames[index].time * 1000);
      const timeStr = frameTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      const now = Math.floor(Date.now() / 1000);
      const isForecast = radarFrames[index].time > now;

      const timeDisplay = document.getElementById("radar-time");
      timeDisplay.innerText = timeStr;
      if (isForecast) {
        timeDisplay.className = "text-indigo-400 font-mono font-bold min-w-[80px] text-center";
      } else {
        timeDisplay.className = "text-emerald-400 font-mono font-bold min-w-[80px] text-center";
      }

      currentFrameIdx = index;
    }

    function startRadarAnimation() {
      if (radarIntervalId) clearInterval(radarIntervalId);

      if (!isPlaying) {
        showFrame(currentFrameIdx);
        return;
      }

      radarIntervalId = setInterval(() => {
        let nextIdx = currentFrameIdx + 1;
        if (nextIdx >= radarFrames.length) {
          nextIdx = 0;
        }
        showFrame(nextIdx);
      }, 1000);
    }

    function toggleRadarPlayback() {
      isPlaying = !isPlaying;
      const btn = document.getElementById("btn-play-pause");
      if (isPlaying) {
        btn.innerText = "Pause";
        btn.className = "bg-blue-600 hover:bg-blue-700 text-white border-none px-2 py-1 rounded";
        startRadarAnimation();
      } else {
        btn.innerText = "Play";
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white border-none px-2 py-1 rounded";
        if (radarIntervalId) {
          clearInterval(radarIntervalId);
          radarIntervalId = null;
        }
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
